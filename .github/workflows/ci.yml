name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint
        # Only the POSIX shell scripts; everything under tools/ is Python.
        run: |
          shellcheck --shell=sh --external-sources \
            install.sh src/kgx-compact tests/run.sh pkg/build-release.sh

  tests:
    name: tests
    runs-on: ubuntu-latest
    # archlinux so the suite runs against the same distribution the overlay targets.
    # Note: the container's default user is root and sudo is NOT installed.
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Console, GTK4 and a virtual display
        run: |
          # -Syu for a complete upgrade: a partial -Sy leaves the package set
          # inconsistent. --overwrite because the base image ships files that newer
          # packages also own, which otherwise aborts the transaction.
          pacman -Syu --noconfirm --needed --overwrite '*' \
            gnome-console gtk4 libadwaita python-gobject python xvfb

      - name: Start Xvfb
        run: Xvfb :99 -screen 0 1280x1024x24 &

      - name: Run the suite
        env:
          DISPLAY: ":99"
          GDK_BACKEND: x11
        run: ./tests/run.sh

  pkgbuild:
    name: PKGBUILD builds
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed --overwrite '*' base-devel git

      - name: Create an unprivileged builder
        # makepkg refuses to run as root, and this container has no sudo, so the
        # only way to drop privileges is su.
        run: |
          useradd -m -s /bin/bash builder
          install -d -o builder -g builder /tmp/pkg

      - name: Build a release tarball from HEAD
        run: |
          # checkout's .git is owned by root, which git refuses to use as-is.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd /tmp/pkg
          version=$(sed -n 's/^pkgver=//p' "$GITHUB_WORKSPACE/pkg/PKGBUILD" | head -n1)
          git -C "$GITHUB_WORKSPACE" archive --format=tar.gz \
            --prefix="kgx-compact-$version/" -o "kgx-compact-$version.tar.gz" HEAD
          cp "$GITHUB_WORKSPACE/pkg/PKGBUILD" .
          chown -R builder:builder /tmp/pkg

      - name: makepkg
        run: su builder -c 'cd /tmp/pkg && makepkg -f --noconfirm --skippgpcheck --nodeps'

      - name: Show what the package installs
        run: |
          echo "--- package contents ---"
          tar --zstd -tvf /tmp/pkg/kgx-compact-*.pkg.tar.zst | awk '{print $NF}' | sort
          echo
          echo "--- enabling? ---"
          echo "expect none: this package installs per-user files and enables nothing"
          rpm -qp --scripts /tmp/pkg/kgx-compact-*.pkg.tar.zst 2>/dev/null | tail -5 || echo "(no scriptlets)"